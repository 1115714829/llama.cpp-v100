# Publishes the multi-architecture image ghcr.io/<owner>/llama.cpp-v100:<version> (and :latest).
# Manual trigger only; no schedule.
# - linux/amd64: built here from .devops/v100-cuda.Dockerfile, checked, pushed, and its docker save
#   file attached to the v100-<version> release.
# - linux/ppc64le (IBM Power AC922 only): built on an AC922 host from the same Dockerfile; its docker
#   save file llama.cpp-v100-server-<version>-ppc64le.tar.gz (with .sha256) must already be attached
#   to the v100-<version> release. It is loaded, checked and pushed here.
# - The two are combined into one tag; `docker pull` selects the host architecture.
name: V100 docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'image version tag, e.g. 1.1.0'
        required: true

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/llama.cpp-v100
  VERSION: ${{ inputs.version }}

jobs:
  amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          # the CUDA devel base image and the build need more than the default free space
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Clone
        uses: actions/checkout@v6

      - name: Build
        run: |
          docker build -f .devops/v100-cuda.Dockerfile --target server -t "$IMAGE:$VERSION-amd64" .

      - name: Check (no GPU on the runner)
        run: |
          # libcuda.so.1 comes from the host driver at run time; every other library must resolve in the image
          missing=$(docker run --rm --entrypoint bash "$IMAGE:$VERSION-amd64" -c 'ldd /app/llama-server /app/libggml-cuda.so | grep "not found" | grep -v "libcuda.so.1" || true')
          [ -z "$missing" ] || { echo "missing libraries: $missing"; exit 1; }
          docker run --rm --entrypoint ffmpeg "$IMAGE:$VERSION-amd64" -version | head -1
          docker run --rm --entrypoint numactl "$IMAGE:$VERSION-amd64" --show | head -1

      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$VERSION-amd64"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="llama.cpp-v100-server-$VERSION-amd64.tar.gz"
          docker tag "$IMAGE:$VERSION-amd64" "llama.cpp-v100:server-$VERSION-amd64"
          docker save "llama.cpp-v100:server-$VERSION-amd64" | gzip -1 > "$name"
          sha256sum "$name" > "$name.sha256"
          ls -l "$name"
          gh release upload "v100-$VERSION" "$name" "$name.sha256" --clobber --repo "${{ github.repository }}"

  ppc64le:
    runs-on: ubuntu-24.04
    steps:
      - name: Download from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="llama.cpp-v100-server-$VERSION-ppc64le.tar.gz"
          gh release download "v100-$VERSION" -p "$name" -p "$name.sha256" --repo "${{ github.repository }}"
          sha256sum -c "$name.sha256"

      - name: Load and check
        run: |
          loaded=$(docker load -i "llama.cpp-v100-server-$VERSION-ppc64le.tar.gz" | sed -n 's/^Loaded image: //p' | tail -1)
          [ -n "$loaded" ] || { echo "no image loaded"; exit 1; }
          arch=$(docker image inspect -f '{{.Architecture}}' "$loaded")
          [ "$arch" = "ppc64le" ] || { echo "unexpected architecture: $arch"; exit 1; }
          docker tag "$loaded" "$IMAGE:$VERSION-ppc64le"

      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$VERSION-ppc64le"

  manifest:
    needs: [amd64, ppc64le]
    runs-on: ubuntu-24.04
    steps:
      - name: Combine
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-ppc64le"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
